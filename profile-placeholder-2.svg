<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1088 960" width="1088" height="960">
  <!-- placeholder for the About photo (same 1088x960 ratio as the original photos) — replace with a real photo -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1626"/>
      <stop offset="1" stop-color="#1f3a5f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#ffffff" fill-opacity="0.75"/>
    </marker>
  </defs>
  <rect width="1088" height="960" fill="url(#bg)"/>
  <rect width="1088" height="960" fill="url(#grid)"/>
  <text x="549" y="230" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="40" letter-spacing="10" fill="#ffffff" fill-opacity="0.65">MEDALLION ARCHITECTURE</text>
  <!-- tiers brighten as data is refined: bronze (raw) -> silver (cleansed) -> gold (curated) -->
  <rect x="64" y="330" width="270" height="180" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  <text x="199" y="438" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#ffffff">BRONZE</text>
  <rect x="409" y="330" width="270" height="180" rx="24" fill="#ffffff" fill-opacity="0.32" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
  <text x="544" y="438" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#ffffff">SILVER</text>
  <rect x="754" y="330" width="270" height="180" rx="24" fill="#ffffff" fill-opacity="0.92"/>
  <text x="889" y="438" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" fill="#0b1626">GOLD</text>
  <path d="M342 420H398" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M687 420H743" stroke="#ffffff" stroke-opacity="0.75" stroke-width="5" marker-end="url(#arrow)"/>
  <g font-family="Consolas, 'Courier New', monospace" font-size="32" letter-spacing="6" fill="#ffffff" fill-opacity="0.6" text-anchor="middle">
    <text x="202" y="575">RAW</text>
    <text x="547" y="575">CLEANSED</text>
    <text x="892" y="575">CURATED</text>
  </g>
  <text x="551" y="770" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" letter-spacing="14" fill="#ffffff" fill-opacity="0.92">JAGAN PONUGUPATI</text>
  <text x="549" y="832" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="30" letter-spacing="10" fill="#ffffff" fill-opacity="0.6">DATA ENGINEER</text>
</svg>
